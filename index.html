<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Small Gift For You</title>
  
  <!-- Fonts: Caveat (Expressive handwritten display) + Plus Jakarta Sans (Clean UI) + Patrick Hand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Paper Texture Layer & Vignette -->
  <div class="paper-grain-overlay" aria-hidden="true"></div>
  <div class="vignette-layer" aria-hidden="true"></div>

  <!-- Main Canvas & Environment -->
  <main class="world-scene" id="worldScene">
    
    <!-- Paper Deckle Frame & Ambient Lighting -->
    <div class="deckle-border-frame" aria-hidden="true"></div>
    <div class="ambient-layer" id="ambientLayer" aria-hidden="true"></div>
    <div class="garden-ambient-glow" id="gardenGlow" aria-hidden="true"></div>

    <!-- ======================================================================
         STAGE 01: OPENING NOTE CARD (PRESERVED UNCHANGED)
         ====================================================================== -->
    <div class="editorial-card-wrapper" id="cardWrapper" data-parallax="0.012">
      <div class="card-art-frame">
        
        <!-- Corner Accents -->
        <div class="frame-corner-doodle top-left" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <path d="M4 28 C 6 12, 12 6, 28 4" stroke="#E8A598" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="3 3"/>
            <circle cx="28" cy="4" r="2.5" fill="#F4C2A5"/>
            <circle cx="4" cy="28" r="2.5" fill="#F4C2A5"/>
          </svg>
        </div>

        <div class="frame-corner-doodle bottom-right" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M12 36 C 24 35, 34 26, 36 12" stroke="#8FA89B" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="3 3"/>
            <circle cx="36" cy="12" r="2.5" fill="#A3BAAE"/>
          </svg>
        </div>

        <!-- Clean Opening Message -->
        <header class="message-container">
          <div class="whisper-tag">
            <span class="tag-leaf">✦</span>
            <span class="tag-text">a warm little note</span>
            <span class="tag-leaf">✦</span>
          </div>

          <h1 class="handwritten-title">
            <span class="line line-1">Here’s a small gift</span>
            <span class="line line-2">
              for you from me 
              <span class="emoticon-smile" title="smile">:D</span>
            </span>
          </h1>

          <div class="hand-drawn-swoosh" aria-hidden="true">
            <svg viewBox="0 0 280 24" class="swoosh-svg" fill="none">
              <path d="M6 14 C 45 4, 110 20, 185 10 C 235 4, 265 14, 274 11" stroke="#E8A598" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M260 6 C 267 11, 273 14, 278 12" stroke="#E8A598" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M276 11 C 274 8, 278 6, 280 8 C 282 6, 286 8, 284 11 C 282 13, 280 15, 280 15 Z" fill="#E8A598"/>
            </svg>
          </div>
        </header>

        <!-- "Click Here" Button -->
        <div class="action-wrapper">
          <button type="button" class="btn-handcrafted" id="giftButton" aria-label="Click Here to open the gift">
            <span class="btn-inner">
              <span class="btn-star-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/>
                </svg>
              </span>
              <span class="btn-label">Click Here</span>
              <span class="btn-sparkle-dot" aria-hidden="true"></span>
            </span>
          </button>
        </div>

      </div>
    </div>

    <!-- ======================================================================
         STAGE 02: BloomScene COMPONENT (REBUILT REUSABLE BOTANICAL WORLD)
         A lush, illustrated flower meadow framing a clean centered message.
         ====================================================================== -->
    <div class="bloom-scene" id="bloomScene" aria-hidden="true">
      
      <!-- Master Botanical Meadow SVG Canvas -->
      <svg class="bloom-meadow-canvas" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" fill="none" xmlns="http://www.w3.org/2000/svg">
        
        <!-- ==================================================================
             REUSABLE BOTANICAL FLOWER & FOLIAGE DEFINITIONS
             ================================================================== -->
        <defs>
          
          <!-- 1. HERO ENGLISH GARDEN ROSE (Multi-layered Dusty Rose & Peach) -->
          <g id="def-rose-hero">
            <!-- Outer Petals Layer 1 -->
            <path d="M-48 -8 C -75 -55, -32 -95, 16 -78 C 60 -58, 42 -16, 8 0 Z" fill="#D4887C" stroke="#382E2B" stroke-width="2"/>
            <path d="M16 -78 C 48 -120, 102 -98, 102 -58 C 102 -20, 48 -8, 8 0 Z" fill="#C66B60" stroke="#382E2B" stroke-width="2"/>
            <path d="M-52 14 C -80 -18, -58 -64, -22 -58 C 14 -52, 8 8, -22 28 Z" fill="#DE8F83" stroke="#382E2B" stroke-width="2"/>

            <path d="M-34 20 C -52 -12, -26 -48, 14 -34 C 48 -18, 34 20, 0 34 Z" fill="#F3BA9B" stroke="#382E2B" stroke-width="1.8"/>
            <path d="M14 26 C 34 -26, 74 -26, 74 14 C 74 40, 34 48, 14 26 Z" fill="#F7CCB2" stroke="#382E2B" stroke-width="1.8"/>

            <!-- Inner Cup & Core Spiral -->
            <path d="M-18 18 C -12 -14, 26 -14, 34 18 C 26 40, -12 40, -18 18 Z" fill="#D4887C" stroke="#382E2B" stroke-width="1.8"/>
            <circle cx="6" cy="12" r="10" fill="#E89B82"/>
            <circle cx="4" cy="8" r="6" fill="#F5CE62"/>
            <circle cx="9" cy="6" r="2.5" fill="#FFFDF9"/>
          </g>

          <!-- 2. MEDIUM ROSE BLOSSOM -->
          <g id="def-rose-mid">
            <path d="M-32 -6 C -50 -38, -20 -65, 10 -52 C 40 -38, 28 -10, 5 0 Z" fill="#D4887C" stroke="#382E2B" stroke-width="1.6"/>
            <path d="M10 -52 C 32 -80, 68 -65, 68 -38 C 68 -12, 32 -6, 5 0 Z" fill="#C66B60" stroke="#382E2B" stroke-width="1.6"/>
            <path d="M-24 12 C -36 -8, -18 -28, 8 -20 C 26 -12, 20 12, 0 20 Z" fill="#F3BA9B" stroke="#382E2B" stroke-width="1.4"/>
            <path d="M8 16 C 20 -16, 44 -16, 44 8 C 44 24, 20 28, 8 16 Z" fill="#F7CCB2" stroke="#382E2B" stroke-width="1.4"/>
            <circle cx="4" cy="6" r="6" fill="#E89B82"/>
            <circle cx="2" cy="4" r="3.5" fill="#F5CE62"/>
          </g>

          <!-- 3. RADIATING WHITE DAISY (16 Delicate Hand-Drawn Petals + Golden Center) -->
          <g id="def-daisy-large">
            <!-- 16 Overlapping Ivory Petals -->
            <ellipse cx="0" cy="-26" rx="6.5" ry="16" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="10" cy="-24" rx="6.5" ry="16" transform="rotate(22.5 10 -24)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="18" cy="-18" rx="6.5" ry="16" transform="rotate(45 18 -18)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="24" cy="-10" rx="6.5" ry="16" transform="rotate(67.5 24 -10)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="26" cy="0" rx="6.5" ry="16" transform="rotate(90 26 0)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="24" cy="10" rx="6.5" ry="16" transform="rotate(112.5 24 10)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="18" cy="18" rx="6.5" ry="16" transform="rotate(135 18 18)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="10" cy="24" rx="6.5" ry="16" transform="rotate(157.5 10 24)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="0" cy="26" rx="6.5" ry="16" transform="rotate(180 0 26)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="-10" cy="24" rx="6.5" ry="16" transform="rotate(202.5 -10 24)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="-18" cy="18" rx="6.5" ry="16" transform="rotate(225 -18 18)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="-24" cy="10" rx="6.5" ry="16" transform="rotate(247.5 -24 10)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="-26" cy="0" rx="6.5" ry="16" transform="rotate(270 -26 0)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="-24" cy="-10" rx="6.5" ry="16" transform="rotate(292.5 -24 -10)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="-18" cy="-18" rx="6.5" ry="16" transform="rotate(315 -18 -18)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="-10" cy="-24" rx="6.5" ry="16" transform="rotate(337.5 -10 -24)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <!-- Stamen Center -->
            <circle cx="0" cy="0" r="12" fill="#F5CE62" stroke="#382E2B" stroke-width="1.5"/>
            <circle cx="-2" cy="-2" r="9" fill="#E8B838"/>
            <circle cx="2" cy="2" r="3" fill="#C89420"/>
          </g>

          <!-- 4. MEDIUM DAISY -->
          <g id="def-daisy-mid">
            <ellipse cx="0" cy="-18" rx="5" ry="12" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="13" cy="-13" rx="5" ry="12" transform="rotate(45 13 -13)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="18" cy="0" rx="5" ry="12" transform="rotate(90 18 0)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="13" cy="13" rx="5" ry="12" transform="rotate(135 13 13)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="0" cy="18" rx="5" ry="12" transform="rotate(180 0 18)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-13" cy="13" rx="5" ry="12" transform="rotate(225 -13 13)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-18" cy="0" rx="5" ry="12" transform="rotate(270 -18 0)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-13" cy="-13" rx="5" ry="12" transform="rotate(315 -13 -13)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>
            <circle cx="0" cy="0" r="8.5" fill="#F5CE62" stroke="#382E2B" stroke-width="1.2"/>
            <circle cx="-1.5" cy="-1.5" r="6" fill="#E8B838"/>
          </g>

          <!-- 5. TALL LAVENDER SPIRE (14 Detailed Clustered Florets) -->
          <g id="def-lavender-spire">
            <ellipse cx="0" cy="-42" rx="5.5" ry="10" fill="#B8A2D8" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-9" cy="-30" rx="6.5" ry="9" transform="rotate(-30 -9 -30)" fill="#A890CE" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="9" cy="-30" rx="6.5" ry="9" transform="rotate(30 9 -30)" fill="#C8B8E4" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-11" cy="-15" rx="7.5" ry="10" transform="rotate(-35 -11 -15)" fill="#B8A2D8" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="11" cy="-15" rx="7.5" ry="10" transform="rotate(35 11 -15)" fill="#D4C6EC" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-10" cy="2" rx="7.5" ry="10" transform="rotate(-30 -10 2)" fill="#A890CE" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="10" cy="2" rx="7.5" ry="10" transform="rotate(30 10 2)" fill="#C8B8E4" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-9" cy="20" rx="7.5" ry="10" transform="rotate(-25 -9 20)" fill="#B8A2D8" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="9" cy="20" rx="7.5" ry="10" transform="rotate(25 9 20)" fill="#D4C6EC" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-8" cy="38" rx="7" ry="10" transform="rotate(-20 -8 38)" fill="#A890CE" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="8" cy="38" rx="7" ry="10" transform="rotate(20 8 38)" fill="#C8B8E4" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="0" cy="54" rx="7" ry="10" fill="#B8A2D8" stroke="#382E2B" stroke-width="1"/>
          </g>

          <!-- 6. PEACH POPPY -->
          <g id="def-poppy-peach">
            <ellipse cx="-16" cy="-10" rx="13" ry="18" transform="rotate(-30 -16 -10)" fill="#F3BA9B" stroke="#382E2B" stroke-width="1.5"/>
            <ellipse cx="16" cy="-10" rx="13" ry="18" transform="rotate(30 16 -10)" fill="#F7CCB2" stroke="#382E2B" stroke-width="1.5"/>
            <ellipse cx="0" cy="14" rx="15" ry="18" fill="#E89B82" stroke="#382E2B" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="7" fill="#D4887C" stroke="#382E2B" stroke-width="1.2"/>
            <circle cx="0" cy="0" r="3.5" fill="#F5CE62"/>
          </g>

          <!-- 7. BLUEBELL WILDFLOWER SPIRE -->
          <g id="def-bluebell-spire">
            <ellipse cx="0" cy="-14" rx="7" ry="11" fill="#8DAEC7" stroke="#382E2B" stroke-width="1.2"/>
            <ellipse cx="-12" cy="0" rx="7" ry="11" transform="rotate(-60 -12 0)" fill="#789DB8" stroke="#382E2B" stroke-width="1.2"/>
            <ellipse cx="12" cy="0" rx="7" ry="11" transform="rotate(60 12 0)" fill="#A3BFD5" stroke="#382E2B" stroke-width="1.2"/>
            <ellipse cx="-7" cy="14" rx="6.5" ry="10" transform="rotate(-130 -7 14)" fill="#8DAEC7" stroke="#382E2B" stroke-width="1.2"/>

            <circle cx="0" cy="0" r="4.5" fill="#F5CE62" stroke="#382E2B" stroke-width="1"/>
          </g>

          <!-- 8. BUTTERCUP YELLOW WILDFLOWER -->
          <g id="def-buttercup">
            <ellipse cx="-10" cy="-7" rx="9" ry="12" transform="rotate(-30 -10 -7)" fill="#F5CE62" stroke="#382E2B" stroke-width="1.2"/>
            <ellipse cx="10" cy="-7" rx="9" ry="12" transform="rotate(30 10 -7)" fill="#F5CE62" stroke="#382E2B" stroke-width="1.2"/>
            <ellipse cx="0" cy="10" rx="10" ry="12" fill="#E8B838" stroke="#382E2B" stroke-width="1.2"/>
            <circle cx="0" cy="0" r="5.5" fill="#D4887C" stroke="#382E2B" stroke-width="1"/>
          </g>

          <!-- 9. PINK WILDFLOWER (5 Petals) -->
          <g id="def-wild-pink">
            <ellipse cx="0" cy="-9" rx="6" ry="9" fill="#DE8F83" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="8" cy="-3" rx="6" ry="9" transform="rotate(72 8 -3)" fill="#F3BA9B" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="5" cy="8" rx="6" ry="9" transform="rotate(144 5 8)" fill="#DE8F83" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-5" cy="8" rx="6" ry="9" transform="rotate(216 -5 8)" fill="#F3BA9B" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="-8" cy="-3" rx="6" ry="9" transform="rotate(288 -8 -3)" fill="#DE8F83" stroke="#382E2B" stroke-width="1"/>
            <circle cx="0" cy="0" r="3.5" fill="#F5CE62" stroke="#382E2B" stroke-width="0.9"/>
          </g>

          <!-- 10. CLUSTERED TINY WHITE WILDFLOWERS (Baby's Breath) -->
          <g id="def-tiny-white-cluster">
            <circle cx="-12" cy="-8" r="4.5" fill="#FFFDF9" stroke="#382E2B" stroke-width="0.8"/>
            <circle cx="-12" cy="-8" r="1.8" fill="#F5CE62"/>
            <circle cx="12" cy="-10" r="5" fill="#FFFDF9" stroke="#382E2B" stroke-width="0.8"/>
            <circle cx="12" cy="-10" r="2" fill="#F5CE62"/>
            <circle cx="0" cy="-16" r="4" fill="#FFFDF9" stroke="#382E2B" stroke-width="0.8"/>
            <circle cx="0" cy="-16" r="1.5" fill="#F5CE62"/>
            <circle cx="-6" cy="6" r="4.5" fill="#FFFDF9" stroke="#382E2B" stroke-width="0.8"/>
            <circle cx="-6" cy="6" r="1.8" fill="#F5CE62"/>
            <circle cx="8" cy="8" r="4" fill="#FFFDF9" stroke="#382E2B" stroke-width="0.8"/>
            <circle cx="8" cy="8" r="1.5" fill="#F5CE62"/>
          </g>

          <!-- 11. ROSE BUD & FOLIAGE SPROUT -->
          <g id="def-rose-bud">
            <path d="M-6 8 C -10 0, -6 -12, 0 -18 C 6 -12, 10 0, 6 8 Z" fill="#D4887C" stroke="#382E2B" stroke-width="1.2"/>
            <path d="M-8 10 C -12 2, -6 -6, -2 -12 C -4 2, -2 8, -8 10 Z" fill="#7A9A8B" stroke="#382E2B" stroke-width="1"/>
            <path d="M8 10 C 12 2, 6 -6, 2 -12 C 4 2, 2 8, 8 10 Z" fill="#7A9A8B" stroke="#382E2B" stroke-width="1"/>
          </g>

          <!-- 12. FEATHERY FERN FROND -->
          <g id="def-fern-frond">
            <path d="M0 240 C -15 160, -10 80, 20 0" stroke="#5E7C6E" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M20 0 C 35 -15, 55 -5, 42 12 C 30 16, 20 10, 20 0 Z" fill="#7A9A8B" stroke="#382E2B" stroke-width="1.2"/>
            <path d="M14 40 C -12 28, -28 42, -10 54 C 4 54, 10 46, 14 40 Z" fill="#7A9A8B" stroke="#382E2B" stroke-width="1.2"/>
            <path d="M10 90 C 45 76, 60 92, 44 106 C 28 106, 14 98, 10 90 Z" fill="#7A9A8B" stroke="#382E2B" stroke-width="1.2"/>
            <path d="M6 140 C -22 126, -36 142, -18 154 C -2 154, 4 146, 6 140 Z" fill="#7A9A8B" stroke="#382E2B" stroke-width="1.2"/>
            <path d="M2 190 C 40 176, 55 192, 38 206 C 22 206, 8 198, 2 190 Z" fill="#7A9A8B" stroke="#382E2B" stroke-width="1.2"/>
          </g>

        </defs>

        <!-- ==================================================================
             DEPTH LAYER 1: BACKGROUND TALL SPIRES, FERNS & DISTANT FOLIAGE
             (Staggered growth delay: 0.4s – 1.0s)
             ================================================================== -->
        <g class="grow-plane-back" style="--delay: 0.4s;">
          
          <!-- Distant Soft Horizon Foliage Wash -->
          <path d="M0 1000 Q 300 780, 800 800 Q 1300 780, 1600 1000 Z" fill="#8DA89A" opacity="0.35"/>

          <!-- LEFT HIGH BACKSTAGE: Tall Fern & Lavender Spires -->
          <use href="#def-fern-frond" x="50" y="240" transform="scale(1.2)" class="foliage-item"/>
          
          <path d="M120 1000 C 110 700, 80 450, 130 220" stroke="#688778" stroke-width="3.5" stroke-linecap="round"/>
          <use href="#def-lavender-spire" x="130" y="220" class="bloom-item flower-lavender"/>

          <path d="M190 1000 C 180 750, 210 560, 185 340" stroke="#688778" stroke-width="3" stroke-linecap="round"/>
          <use href="#def-lavender-spire" x="185" y="340" transform="scale(0.85)" class="bloom-item flower-lavender"/>

          <!-- RIGHT HIGH BACKSTAGE: Tall Lavender & Fern -->
          <path d="M1480 1000 C 1490 700, 1520 450, 1470 220" stroke="#688778" stroke-width="3.5" stroke-linecap="round"/>
          <use href="#def-lavender-spire" x="1470" y="220" class="bloom-item flower-lavender"/>

          <use href="#def-fern-frond" x="1560" y="240" transform="scale(-1.2, 1.2)" class="foliage-item"/>

          <path d="M1410 1000 C 1420 750, 1390 560, 1415 340" stroke="#688778" stroke-width="3" stroke-linecap="round"/>
          <use href="#def-lavender-spire" x="1415" y="340" transform="scale(0.85)" class="bloom-item flower-lavender"/>

        </g>

        <!-- ==================================================================
             DEPTH LAYER 2: MIDGROUND BOTANICAL CLUSTERS (DAISIES, POPPIES, BLUEBELLS)
             (Staggered growth delay: 1.0s – 1.8s)
             ================================================================== -->
        <g class="grow-plane-mid" style="--delay: 1.0s;">
          
          <!-- LEFT FLANK MIDGROUND FLOWERS -->
          <!-- High Left Hero Daisy (x: 245, y: 390) -->
          <path d="M240 1000 C 250 780, 210 580, 245 390" stroke="#688778" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M235 560 C 185 540, 175 515, 210 505 C 230 515, 238 545, 235 560 Z" fill="#7A9A8B" stroke="#382E2B" stroke-width="1.2"/>
          <use href="#def-daisy-large" x="245" y="390" class="bloom-item flower-daisy"/>

          <!-- Left Peach Poppy (x: 180, y: 490) -->
          <path d="M170 1000 C 190 800, 140 650, 180 490" stroke="#688778" stroke-width="3.2" stroke-linecap="round"/>
          <use href="#def-poppy-peach" x="180" y="490" class="bloom-item flower-poppy"/>

          <!-- Left Bluebell Spire (x: 105, y: 550) -->
          <path d="M95 1000 C 115 820, 75 690, 105 550" stroke="#688778" stroke-width="2.8" stroke-linecap="round"/>
          <use href="#def-bluebell-spire" x="105" y="550" class="bloom-item flower-bluebell"/>

          <!-- Left Pink Wildflower (x: 290, y: 490) -->
          <path d="M280 1000 C 290 820, 270 660, 290 490" stroke="#688778" stroke-width="2.8" stroke-linecap="round"/>
          <use href="#def-wild-pink" x="290" y="490" transform="scale(1.2)" class="bloom-item flower-pink"/>

          <!-- CONTINUOUS BOTTOM MEADOW (Staggered Midground Arc) -->
          <!-- Mid Daisy 1 (x: 360, y: 560) -->
          <path d="M350 1000 C 365 820, 340 680, 360 560" stroke="#688778" stroke-width="3" stroke-linecap="round"/>
          <use href="#def-daisy-mid" x="360" y="560" class="bloom-item flower-daisy"/>
