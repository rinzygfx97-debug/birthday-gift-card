<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Small Gift For You</title>
  
  <!-- Fonts: Caveat (Expressive handwritten display) + Plus Jakarta Sans (Clean UI) + Patrick Hand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Paper Texture Layer & Vignette -->
  <div class="paper-grain-overlay" aria-hidden="true"></div>
  <div class="vignette-layer" aria-hidden="true"></div>

  <!-- Main Canvas & Environment -->
  <main class="world-scene" id="worldScene">
    
    <!-- Paper Deckle Frame & Ambient Lighting -->
    <div class="deckle-border-frame" aria-hidden="true"></div>
    <div class="ambient-layer" id="ambientLayer" aria-hidden="true"></div>
    <div class="garden-ambient-glow" id="gardenGlow" aria-hidden="true"></div>

    <!-- ======================================================================
         STAGE 01: OPENING NOTE CARD (PRESERVED UNCHANGED)
         ====================================================================== -->
    <div class="editorial-card-wrapper" id="cardWrapper" data-parallax="0.012">
      <div class="card-art-frame">
        
        <!-- Corner Accents -->
        <div class="frame-corner-doodle top-left" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <path d="M4 28 C 6 12, 12 6, 28 4" stroke="#E8A598" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="3 3"/>
            <circle cx="28" cy="4" r="2.5" fill="#F4C2A5"/>
            <circle cx="4" cy="28" r="2.5" fill="#F4C2A5"/>
          </svg>
        </div>

        <div class="frame-corner-doodle bottom-right" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M12 36 C 24 35, 34 26, 36 12" stroke="#8FA89B" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="3 3"/>
            <circle cx="36" cy="12" r="2.5" fill="#A3BAAE"/>
          </svg>
        </div>

        <!-- Clean Opening Message -->
        <header class="message-container">
          <div class="whisper-tag">
            <span class="tag-leaf">✦</span>
            <span class="tag-text">a warm little note</span>
            <span class="tag-leaf">✦</span>
          </div>

          <h1 class="handwritten-title">
            <span class="line line-1">Here’s a small gift</span>
            <span class="line line-2">
              for you from me 
              <span class="emoticon-smile" title="smile">:D</span>
            </span>
          </h1>

          <div class="hand-drawn-swoosh" aria-hidden="true">
            <svg viewBox="0 0 280 24" class="swoosh-svg" fill="none">
              <path d="M6 14 C 45 4, 110 20, 185 10 C 235 4, 265 14, 274 11" stroke="#E8A598" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M260 6 C 267 11, 273 14, 278 12" stroke="#E8A598" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M276 11 C 274 8, 278 6, 280 8 C 282 6, 286 8, 284 11 C 282 13, 280 15, 280 15 Z" fill="#E8A598"/>
            </svg>
          </div>
        </header>

        <!-- "Click Here" Button -->
        <div class="action-wrapper">
          <button type="button" class="btn-handcrafted" id="giftButton" aria-label="Click Here to open the gift">
            <span class="btn-inner">
              <span class="btn-star-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/>
                </svg>
              </span>
              <span class="btn-label">Click Here</span>
              <span class="btn-sparkle-dot" aria-hidden="true"></span>
            </span>
          </button>
        </div>

      </div>
    </div>

    <!-- ======================================================================
         STAGE 02: BloomScene COMPONENT (STAGE 2A: RICH DENSE BOTTOM MEADOW)
         A lush, illustrated flower meadow framing a clean centered message.
         ====================================================================== -->
    <div class="bloom-scene" id="bloomScene" aria-hidden="true">
      
      <!-- Master Botanical Meadow SVG Canvas -->
      <svg class="bloom-meadow-canvas" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" fill="none" xmlns="http://www.w3.org/2000/svg">
        
        <!-- ==================================================================
             REUSABLE BOTANICAL FLOWER & FOLIAGE DEFINITIONS
             Hand-drawn ink outlines (#382E2B), layered petals, muted watercolor fills
             ================================================================== -->
        <defs>
          
          <!-- 1. HERO ENGLISH GARDEN ROSE (Multi-layered Dusty Rose & Peach) -->

            <!-- Outer Petals Layer 1 -->
            <path d="M-48 -8 C -75 -55, -32 -95, 16 -78 C 60 -58, 42 -16, 8 0 Z" fill="#D4887C" stroke="#382E2B" stroke-width="2"/>
            <path d="M16 -78 C 48 -120, 102 -98, 102 -58 C 102 -20, 48 -8, 8 0 Z" fill="#C66B60" stroke="#382E2B" stroke-width="2"/>

            <path d="M-18 18 C -12 -14, 26 -14, 34 18 C 26 40, -12 40, -18 18 Z" fill="#D4887C" stroke="#382E2B" stroke-width="1.8"/>
            <circle cx="6" cy="12" r="10" fill="#E89B82"/>
            <circle cx="4" cy="8" r="6" fill="#F5CE62"/>
            <circle cx="9" cy="6" r="2.5" fill="#FFFDF9"/>
          </g>

          <!-- 2. MEDIUM ROSE BLOSSOM -->
          <g id="def-rose-mid">
            <path d="M-32 -6 C -50 -38, -20 -65, 10 -52 C 40 -38, 28 -10, 5 0 Z" fill="#D4887C" stroke="#382E2B" stroke-width="1.6"/>

          <!-- 3. LARGE RADIATING WHITE DAISY (16 Petals + Amber Stamen) -->
          <g id="def-daisy-large">
            <ellipse cx="0" cy="-26" rx="6.5" ry="16" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="10" cy="-24" rx="6.5" ry="16" transform="rotate(22.5 10 -24)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="18" cy="-18" rx="6.5" ry="16" transform="rotate(45 18 -18)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>
            <ellipse cx="24" cy="-10" rx="6.5" ry="16" transform="rotate(67.5 24 -10)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>

            <ellipse cx="0" cy="26" rx="6.5" ry="16" transform="rotate(180 0 26)" fill="#FFFDF9" stroke="#382E2B" stroke-width="1.3"/>

            <circle cx="0" cy="0" r="12" fill="#F5CE62" stroke="#382E2B" stroke-width="1.5"/>
            <circle cx="-2" cy="-2" r="9" fill="#E8B838"/>
            <circle cx="2" cy="2" r="3" fill="#C89420"/>
          </g>

          <!-- 4. MEDIUM DAISY (12 Petals) -->
          <g id="def-daisy-mid">
            <ellipse cx="0" cy="-18" rx="5" ry="12" fill="#FFFDF9" stroke="#382E2B" stroke-width="1"/>

            <ellipse cx="-8" cy="38" rx="7" ry="10" transform="rotate(-20 -8 38)" fill="#A890CE" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="8" cy="38" rx="7" ry="10" transform="rotate(20 8 38)" fill="#C8B8E4" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="0" cy="54" rx="7" ry="10" fill="#B8A2D8" stroke="#382E2B" stroke-width="1"/>
          </g>

          <!-- 6. PEACH POPPY -->
          <g id="def-poppy-peach">
            <ellipse cx="-16" cy="-10" rx="13" ry="18" transform="rotate(-30 -16 -10)" fill="#F3BA9B" stroke="#382E2B" stroke-width="1.5"/>

            <circle cx="0" cy="0" r="3.5" fill="#F5CE62"/>

          <!-- 7. BLUEBELL WILDFLOWER SPIRE -->
          <g id="def-bluebell-spire">
            <ellipse cx="0" cy="-14" rx="7" ry="11" fill="#8DAEC7" stroke="#382E2B" stroke-width="1.2"/>

            <circle cx="0" cy="0" r="5.5" fill="#D4887C" stroke="#382E2B" stroke-width="1"/>
          </g>

          <!-- 9. PINK WILDFLOWER (5 Petals) -->
          <g id="def-wild-pink">
            <ellipse cx="0" cy="-9" rx="6" ry="9" fill="#DE8F83" stroke="#382E2B" stroke-width="1"/>
            <ellipse cx="8" cy="-3" rx="6" ry="9" transform="rotate(72 8 -3)" fill="#F3BA9B" stroke="#382E2B" stroke-width="1"/>

            <circle cx="-12" cy="-8" r="4.5" fill="#FFFDF9" stroke="#382E2B" stroke-width="0.8"/>

        <!-- ==================================================================
             STAGE 2A: DEPTH LAYER 1 (BACKGROUND MEADOW FLOWERS & TALL SPIRES)

             ================================================================== -->
        <g class="grow-plane-back" style="--delay: 0.3s;">

          <!-- DENSE BACKGROUND MEADOW FLOWERS (Staggered y: 620–700) -->
          <!-- Background Lavender 1 -->
          <path d="M190 1000 C 180 820, 200 720, 185 620" stroke="#688778" stroke-width="2.8" stroke-linecap="round"/>
          <use href="#def-lavender-spire" x="185" y="620" transform="scale(0.8)" class="bloom-item flower-lavender"/>

          <!-- Background Small Daisy 1 -->

          <!-- Background Bluebell 1 -->
          <path d="M460 1000 C 470 850, 450 740, 460 640" stroke="#688778" stroke-width="2.5" stroke-linecap="round"/>
          <use href="#def-bluebell-spire" x="460" y="640" transform="scale(0.85)" class="bloom-item flower-bluebell"/>

          <!-- Background Buttercup 1 -->
          <path d="M550 1000 C 540 850, 560 750, 550 660" stroke="#688778" stroke-width="2.5" stroke-linecap="round"/>

          <use href="#def-tiny-white-cluster" x="720" y="670" transform="scale(0.9)" class="bloom-item"/>

          <!-- Center Dip Small Rose Blossom -->

          <use href="#def-rose-mid" x="800" y="680" transform="scale(0.75)" class="bloom-item flower-rose"/>
